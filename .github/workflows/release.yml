name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/diffloom-0.1.0/include
          cp README.md LICENSE CHANGELOG.md dist/diffloom-0.1.0/
          cp include/diffloom.h dist/diffloom-0.1.0/include/
          cp target/release/diffloom dist/diffloom-0.1.0/
          tar -C dist -czf dist/diffloom-0.1.0-linux-x86_64.tar.gz diffloom-0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: diffloom-0.1.0-linux-x86_64
          path: dist/diffloom-0.1.0-linux-x86_64.tar.gz
